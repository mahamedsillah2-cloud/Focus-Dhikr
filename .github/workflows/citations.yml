name: Verify citations

# Requirement 5: no invented scripture, ever.
#
# Every Qur'anic citation is downloaded from the Quran.com API and compared
# against what the app ships, character by character on the normalised Arabic
# skeleton. Every hadith reference must resolve and contain the Arabic quoted.
# A citation that cannot be verified fails the build rather than shipping.
#
# Both platforms are checked, and the Android and iOS copies must carry
# byte-identical Arabic. A citation that is right on one platform and subtly
# wrong on the other is worse than one that is wrong on both: the mistake hides
# behind a passing check.

on:
  push:
    paths:
      - "app/src/main/java/com/focusdhikr/content/**"
      - "ios/Shared/Content/**"
      - "tools/verify_citations.py"
      - ".github/workflows/citations.yml"
  pull_request:
    paths:
      - "app/src/main/java/com/focusdhikr/content/**"
      - "ios/Shared/Content/**"
      - "tools/verify_citations.py"
  schedule:
    # Weekly, so an upstream correction is noticed even without a code change.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Structural check
        run: python3 tools/verify_citations.py --offline

      - name: Verify against primary sources
        run: python3 tools/verify_citations.py
