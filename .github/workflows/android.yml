name: Build APK

# The APK is built here rather than locally: this repository was developed in an
# environment where dl.google.com is unreachable, so the Android SDK and the
# AndroidX artifacts cannot be fetched there. GitHub's runners have both.
# Download the artifact from the run summary and install it on the phone -
# see docs/INSTALACION.md.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

  build:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Prove the APK cannot reach the network
        # The privacy claim is enforced by the OS, not by a policy document.
        # If someone ever adds the INTERNET permission, this fails the build.
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "Permissions declared by the APK:"
          "$AAPT" dump permissions "$APK" | tee /tmp/perms.txt
          if grep -q "android.permission.INTERNET" /tmp/perms.txt; then
            echo "::error::The APK declares INTERNET. Focus Dhikr must not be able to open a socket."
            exit 1
          fi
          echo "Confirmed: no INTERNET permission."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-dhikr-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
