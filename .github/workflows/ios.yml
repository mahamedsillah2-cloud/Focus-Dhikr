name: Build iOS

# Compiles the iOS app and runs the Swift unit tests on a macOS runner, because
# the development environment has no Mac. This is what proves the Swift
# actually compiles rather than merely looking right.
#
# It builds the committed FocusDhikr.xcodeproj - the same file you open with
# "Open Existing Project" - so a project that breaks in Xcode breaks here too,
# and it is pinned to Xcode 16.4 for the same reason.
#
# Note it builds for the Simulator with signing disabled. The Family Controls
# entitlement is applied at signing time, so this verifies the code, not the
# entitlement - that part only becomes real once Apple approves the request.
# See docs/IOS_APP.md.

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          else
            echo "::warning::Xcode 16.4 is not on this runner; using the default."
            ls -d /Applications/Xcode*.app
          fi
          xcodebuild -version

      - name: Show the targets Xcode reads from the committed project
        working-directory: ios
        run: xcodebuild -list -project FocusDhikr.xcodeproj

      - name: Build the app
        working-directory: ios
        run: |
          xcodebuild build \
            -project FocusDhikr.xcodeproj \
            -scheme FocusDhikr \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Check the extensions really got embedded
        working-directory: ios
        run: |
          set -e
          APP=$(xcodebuild -project FocusDhikr.xcodeproj -scheme FocusDhikr \
                  -destination 'generic/platform=iOS Simulator' \
                  -showBuildSettings 2>/dev/null \
                | awk -F' = ' '/ BUILT_PRODUCTS_DIR /{print $2; exit}')/FocusDhikr.app
          echo "app bundle: $APP"
          for ext in FocusDhikrMonitor FocusDhikrShield FocusDhikrShieldAction; do
            test -d "$APP/PlugIns/$ext.appex" || { echo "missing PlugIns/$ext.appex"; exit 1; }
            echo "  ok  PlugIns/$ext.appex"
          done
          # The report extension is ExtensionKit: it lands in Extensions/, not PlugIns/.
          test -d "$APP/Extensions/FocusDhikrReport.appex" || {
            echo "missing Extensions/FocusDhikrReport.appex"; exit 1; }
          echo "  ok  Extensions/FocusDhikrReport.appex"

      - name: Run unit tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project FocusDhikr.xcodeproj \
            -scheme FocusDhikr \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
