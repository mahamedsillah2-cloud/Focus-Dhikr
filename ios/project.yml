# XcodeGen spec.
#
# The .xcodeproj is generated, not committed: a hand-written project.pbxproj is
# a thousand lines of UUID bookkeeping that breaks in ways nobody can review.
#
#   brew install xcodegen && cd ios && xcodegen generate
#
# See docs/IOS_APP.md.

name: FocusDhikr

options:
  bundleIdPrefix: com.focusdhikr
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:

  # ---------------------------------------------------------------- app ----
  FocusDhikr:
    type: application
    platform: iOS
    sources:
      - path: FocusDhikr
      - path: Shared
    dependencies:
      - target: FocusDhikrMonitor
        embed: true
      - target: FocusDhikrShield
        embed: true
      - target: FocusDhikrShieldAction
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusdhikr.app
        # Required for the INFOPLIST_KEY_* settings below to produce an actual
        # Info.plist. Without it the app builds and links, then fails at
        # ValidateEmbeddedBinary because the extensions are validated against a
        # plist that was never written.
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Focus Dhikr
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    entitlements:
      path: FocusDhikr/FocusDhikr.entitlements
      properties:
        # Requested from Apple. Development works immediately; shipping needs a
        # separate approval. See docs/IOS_APP.md.
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.focusdhikr.shared

  # ------------------------------------------------ device activity monitor --
  FocusDhikrMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: FocusDhikrMonitor
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusdhikr.app.monitor
        INFOPLIST_KEY_CFBundleDisplayName: Focus Dhikr Monitor
    info:
      path: FocusDhikrMonitor/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: FocusDhikrMonitor/FocusDhikrMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.focusdhikr.shared

  # ------------------------------------------------ shield configuration ----
  FocusDhikrShield:
    type: app-extension
    platform: iOS
    sources:
      - path: FocusDhikrShield
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusdhikr.app.shield
        INFOPLIST_KEY_CFBundleDisplayName: Focus Dhikr Shield
    info:
      path: FocusDhikrShield/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: FocusDhikrShield/FocusDhikrShield.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.focusdhikr.shared

  # ------------------------------------------------------- shield action ----
  FocusDhikrShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - path: FocusDhikrShieldAction
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusdhikr.app.shieldaction
        INFOPLIST_KEY_CFBundleDisplayName: Focus Dhikr Shield Action
    info:
      path: FocusDhikrShieldAction/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: FocusDhikrShieldAction/FocusDhikrShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.focusdhikr.shared

  # -------------------------------------------------------------- tests ----
  # Host-less on purpose: these cover the pure gate logic and the citation
  # libraries, so they must not need a simulator to launch an app first.
  FocusDhikrTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focusdhikr.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FocusDhikr:
    build:
      targets:
        FocusDhikr: all
        FocusDhikrTests: [test]
    test:
      targets:
        - FocusDhikrTests
      gatherCoverageData: false
